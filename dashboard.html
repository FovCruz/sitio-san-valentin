<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro espacio ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&family=Darker+Grotesque:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg-top: #1B2735;
            --bg-bottom: #090A0F;
            --text-color: #ffffff;
            --accent-gradient: linear-gradient(135deg, #6868d5, #ff4081); /* Color unificado */
            --glass-bg: rgba(20, 30, 50, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(ellipse at bottom, var(--bg-top) 0%, var(--bg-bottom) 100%);
            height: 100vh; overflow: hidden; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            user-select: none;
        }

        /* --- FONDO --- */
        .star-layer { position: fixed; top: 0; left: 0; background: transparent; z-index: -1; pointer-events: none; }
        .star-layer::after { content: " "; position: absolute; top: 2000px; background: transparent; }
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }
        #stars { width: 1px; height: 1px; animation: animStar 50s linear infinite; }
        #stars::after { width: 1px; height: 1px; }
        #stars2 { width: 2px; height: 2px; animation: animStar 100s linear infinite; }
        #stars2::after { width: 2px; height: 2px; }

        /* --- HEADER --- */
        .header { position: absolute; top: 5vh; text-align: center; z-index: 10; width: 100%; pointer-events: none; }
        .subtitle { color: #ff4081; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .main-title { font-family: 'Dancing Script', cursive; font-size: clamp(2rem, 4vw, 3rem); text-shadow: 0 0 15px rgba(255,255,255,0.3); }

        /* --- SLIDER 3D --- */
        .slider-container {
            perspective: 1000px; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: grab; z-index: 5;
        }
        .slider-track { display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; height: 100%; width: 100%; }

        .card {
            position: absolute;
            background: #1e1e1e; overflow: hidden; transform-style: preserve-3d;
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            width: 280px; height: 400px; /* Tamaño Desktop */
        }

        .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; transition: 0.5s; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.95) 100%); z-index: 2; pointer-events: none; }
        
        .card-label {
            position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center;
            z-index: 3; font-size: 1.5rem; font-weight: 600; color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none;
            font-family: 'Dancing Script', cursive; letter-spacing: 1px;
            transition: opacity 0.3s;
        }

        /* --- CARD EXPANDIDA (INFO INTERNA) --- */
        .card.expanded { z-index: 1000 !important; border: none; cursor: default; }
        .card.expanded img { transform: scale(1.1); filter: brightness(0.6); }
        .card.expanded .card-label { opacity: 0; } /* Ocultamos el label simple al expandir */

        /* Contenedor de Info que se inyecta JS */
        .expanded-content {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px;
            z-index: 10; text-align: center; opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s 0.3s, transform 0.6s 0.3s; /* Delay para que aparezca suave */
        }
        .card.expanded .expanded-content { opacity: 1; transform: translateY(0); }

        .expanded-content h2 { font-family: 'Dancing Script'; font-size: 3rem; margin-bottom: 10px; color: #ff4081; line-height: 1; }
        .expanded-content p { font-size: 1rem; color: #ddd; margin-bottom: 20px; line-height: 1.4; }
        
        .enter-btn {
            background: var(--accent-gradient);
            color: white; border: none; padding: 12px 35px; border-radius: 50px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 64, 129, 0.5);
            text-transform: uppercase; letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .enter-btn:active { transform: scale(0.95); }

        /* Close Button (Dentro de la card expandida) */
        .card-close {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); border-radius: 50%; color: white;
            display: flex; align-items: center; justify-content: center;
            z-index: 11; cursor: pointer; opacity: 0; transition: 0.3s;
        }
        .card.expanded .card-close { opacity: 1; }

        .slider-track.blurred .card:not(.expanded) { filter: blur(8px) brightness(0.3); transition: 0.5s; }

        /* --- BOTONES ESQUINA (DRAWERS) --- */
        
        /* --- BOTONES FLOTANTES (UI/UX MEJORADO) --- */
        .fab-btn {
            position: fixed; bottom: 30px; height: 60px;
            background: var(--accent-gradient); border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 2000;
            display: flex; align-items: center; overflow: hidden;
            cursor: pointer; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* FAB Izquierdo: Reiniciar */
        .fab-left { left: 20px; width: 60px; justify-content: flex-start; }
        .fab-left.active { width: 150px; }
        .fab-left .fab-icon { min-width: 60px; text-align: center; font-size: 1.4rem; color: white; }
        .fab-left .fab-text { color: white; font-weight: 600; font-size: 1rem; opacity: 0; transition: 0.3s; white-space: nowrap; }
        .fab-left.active .fab-text { opacity: 1; }

        /* FAB Derecho: Música */
        .fab-right { right: 20px; width: 60px; justify-content: flex-end; }
        .fab-right .fab-icon { min-width: 60px; text-align: center; font-size: 1.4rem; color: white; transition: 0.3s; }
        
        .fab-right.active {
            width: 320px; height: 140px; border-radius: 24px;
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); justify-content: center; align-items: center;
        }
        .fab-right.active .fab-icon { display: none; }

        /* Contenido del Player */
        .player-content {
            opacity: 0; width: 100%; padding: 15px 20px; pointer-events: none;
            display: none; flex-direction: column; justify-content: center;
        }
        .fab-right.active .player-content { opacity: 1; pointer-events: all; display: flex; animation: fadeIn 0.5s 0.2s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .p-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; }
        .p-title { font-size: 1rem; font-weight: 600; color: #ff4081; white-space: nowrap; }
        .p-close { font-size: 1.2rem; cursor: pointer; padding: 5px; color: #aaa; transition: color 0.2s; }
        .p-close:hover { color: white; }
        
        .p-controls { display: flex; align-items: center; justify-content: center; gap: 25px; margin-top: 10px; }
        .p-btn { font-size: 1.8rem; cursor: pointer; color: white; transition: transform 0.2s; }
        .p-btn:active { transform: scale(0.8); }
        
        .wave-mini svg path { fill: url(#PSgrad_0); animation: 4s infinite; }
        @keyframes morph { 0%,100%{d:path('M299,15 L0,15 L0,6 C12,9 21,10 26,10 C34,10 47,2 57,2 C67,2 71,7 81,7 C91,7 95,0 104,0 C112,0 118,13 129,13 C140,13 138,7 146,7 C154,7 160,10 170,10 C181,10 184,2 192,2 C201,2 209,8 217,8 C225,8 236,4 243,4 C250,4 264,12 272,12 C276,12 286,10 299,6 L299,15 Z')} 50%{d:path('M299,15 L0,15 L0,5 C9,3 17,2 22,2 C30,2 35,9 45,9 C55,9 60,6 70,6 C80,6 94,0 102,0 C111,0 115,7 126,7 C137,7 137,4 148,4 C159,4 163,11 174,11 C185,11 187,0 197,0 C207,0 216,5 224,5 C232,5 236,2 244,2 C252,2 258,11 266,11 C273,11 288,3 299,3 L299,15 Z')} }

        #transition-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; opacity:0; pointer-events:none; z-index:9999; transition: opacity 1s; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .fab-right.active { 
                /* En móvil, el player toma todo el ancho inferior para ser más cómodo */
                width: calc(100% - 40px); left: 20px; right: 20px; bottom: 20px;
            }
        }

        /* OVERLAY ZOOM */
        #transition-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; opacity:0; pointer-events:none; z-index:9999; transition: opacity 1s; }
        .zooming-in { transform: scale(20); pointer-events: none; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .card {
                /* MÓVIL: Más estrechas para que se vean apiladas */
                width: 180px; 
                height: 300px;
            }
            .header { top: 2vh; }
            .main-title { font-size: 3rem; }
            
            /* Ajuste Drawers en móvil */
            .corner-drawer-left { bottom: 20px; padding: 12px 15px; }
            .corner-drawer-right { bottom: 20px; height: 50px; width: 60px; }
            .corner-drawer-right.active { width: 100%; right: 0; border-radius: 20px 20px 0 0; bottom: 0; height: 180px; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="stars" class="star-layer"></div>
    <div id="stars2" class="star-layer"></div>

    <div id="transition-overlay"></div>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack">
            <div class="card" data-title="Nuestra Historia" data-desc="El comienzo de todo... Haz clic para leer como empezó nuestra aventura." data-link="libro/libro.html">
                <img src="assets/copas.jpg">
                <div class="card-label">Historia</div>
            </div>
            <div class="card" data-title="Cupones de Amor" data-desc="Canjeables por besos, abrazos y momentos especiales." data-link="cuponera-estatica.html">
                <img src="assets/cuponera.jpg" alt="Cupones">
                <div class="card-label">Cupones</div>
            </div>
            <div class="card" data-title="El Mapa" data-desc="La ruta hacia nuestro futuro juntos. ¿Vamos?" data-link="mapa/index.html">
                <img src="assets/mapa.jpg" alt="Mapa">
                <div class="card-label">Mapa</div>
            </div>
            <div class="card" data-title="Playlist" data-desc="La banda sonora de nuestras vidas. Dale play." data-link="playlist/index.html">
                <img src="assets/musica.jpg" alt="Música">
                <div class="card-label">Playlist</div>
            </div>
            <div class="card" data-title="Dosis de Ternura" data-desc="Gatitos y amor aleatorio para alegrar tu día." data-link="sorpresa.html">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&h=800">
                <div class="card-label">Sorpresa</div>
            </div>
        </div>
    </div>

    <div class="fab-btn fab-left" id="restartDrawer">
        <i class="fas fa-redo fab-icon"></i>
        <span class="fab-text">Reiniciar</span>
    </div>

        
    <div class="fab-btn fab-right" id="musicDrawer">
        <i class="fas fa-music fab-icon"></i>
        
        <div class="player-content">
            <div class="p-header">
                <span class="p-title">🎵 Nuestra Canción</span>
                <i class="fas fa-times p-close" id="closePlayer"></i>
            </div>
            
            <div class="wave-mini">
                <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="20" viewBox="0 0 299 15" preserveAspectRatio="none">
                    <linearGradient id="PSgrad_0" x1="70%" x2="0%" y1="70%" y2="0%">
                        <stop offset="0%" stop-color="#ff4081" stop-opacity="1" />
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
                    </linearGradient>
                    <path fill="url(#PSgrad_0)"/>
                </svg>
            </div>

            <div class="p-controls">
                <i class="fas fa-backward p-btn" onclick="document.getElementById('audio-track').currentTime -= 10"></i>
                <i id="playBtn" class="fas fa-play-circle p-btn" style="font-size: 2.2rem;"></i>
                <i id="pauseBtn" class="fas fa-pause-circle p-btn" style="font-size: 2.2rem; display:none"></i>
                <i class="fas fa-forward p-btn" onclick="document.getElementById('audio-track').currentTime += 10"></i>
            </div>
            <audio id="audio-track" src="https://api.podcache.net/episodes/d748b852-11d6-4f25-9295-c314e0c8ad04/stream.mp3" preload="metadata"></audio>
        </div>
    </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN POSICIONES ---
        const getPositions = () => {
            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                // MÓVIL: Muy juntas (overlap)
                return [
                    { z: 100, rotateY: 0, x: 0, opacity: 1, scale: 1 },
                    { z: 50, rotateY: -10, x: 60, opacity: 0.8, scale: 0.9 },  // Muy pegada derecha
                    { z: 0, rotateY: -20, x: 120, opacity: 0.6, scale: 0.8 },
                    { z: 0, rotateY: 20, x: -120, opacity: 0.6, scale: 0.8 },
                    { z: 50, rotateY: 10, x: -60, opacity: 0.8, scale: 0.9 }   // Muy pegada izquierda
                ];
            } else {
                // DESKTOP: Arco amplio
                return [
                    { z: 200, rotateY: 0, x: 0, opacity: 1, scale: 1 },
                    { z: 100, rotateY: -15, x: 220, opacity: 0.8, scale: 0.9 },
                    { z: 0, rotateY: -30, x: 400, opacity: 0.5, scale: 0.8 },
                    { z: 0, rotateY: 30, x: -400, opacity: 0.5, scale: 0.8 },
                    { z: 100, rotateY: 15, x: -220, opacity: 0.8, scale: 0.9 }
                ];
            }
        };

        // --- 2. LOGICA SLIDER & EXPANSION ---
        class CircularSlider {
            constructor() {
                this.track = document.getElementById("sliderTrack");
                this.cards = Array.from(document.querySelectorAll(".card"));
                this.container = document.getElementById("sliderContainer");
                this.expandedCard = null;
                this.isDragging = false;
                this.startX = 0;
                this.init();
            }

            init() {
                this.updatePositions();
                this.attachEvents();
                window.addEventListener('resize', () => this.updatePositions());
            }

            updatePositions() {
                const positions = getPositions();
                this.cards.forEach((card, index) => {
                    const pos = positions[index];
                    gsap.to(card, {
                        x: pos.x, z: pos.z, rotationY: pos.rotateY,
                        opacity: pos.opacity, scale: pos.scale,
                        duration: 0.5, ease: "power2.out"
                    });
                    // Z-index dinámico
                    card.style.zIndex = Math.round(pos.opacity * 100);
                    // Solo el centro interactúa
                    if (index === 0) {
                        card.style.pointerEvents = "all";
                        card.style.filter = "none";
                    } else {
                        card.style.pointerEvents = "none";
                        card.style.filter = "brightness(0.5)"; // Oscurecer las de atrás
                    }
                });
            }

            rotate(direction) {
                if (this.expandedCard) return;
                if (direction === "next") this.cards.push(this.cards.shift());
                else this.cards.unshift(this.cards.pop());
                this.updatePositions();
            }

            expandCard(card) {
                if (this.expandedCard) return;
                this.expandedCard = card;

                // 1. Crear contenido INTERNO
                const title = card.dataset.title;
                const desc = card.dataset.desc;
                const link = card.dataset.link;

                // HTML a inyectar sobre la carta
                const innerHTML = `
                    <div class="card-close"><i class="fas fa-times"></i></div>
                    <div class="expanded-content">
                        <h2>${title}</h2>
                        <p>${desc}</p>
                        <button class="enter-btn" onclick="NavigationManager.zoomTo('${link}')">Entrar</button>
                    </div>
                `;
                
                // Clonar para la animación (para no romper el layout del slider)
                const rect = card.getBoundingClientRect();
                const clone = card.cloneNode(true);
                clone.innerHTML += innerHTML; // Agregamos info
                
                // Estilos iniciales del clon
                clone.style.position = "fixed";
                clone.style.left = rect.left + "px";
                clone.style.top = rect.top + "px";
                clone.style.width = rect.width + "px";
                clone.style.height = rect.height + "px";
                clone.style.transform = "none";
                clone.style.zIndex = "5000";
                clone.classList.add("expanded");
                
                document.body.appendChild(clone);
                this.cardClone = clone;

                // Ocultar original
                gsap.set(card, { opacity: 0 });
                this.track.classList.add("blurred");

                // Configurar botón cerrar del clon
                clone.querySelector(".card-close").addEventListener("click", (e) => {
                    e.stopPropagation(); this.closeCard();
                });

                // Animación Expansión
                const isMobile = window.innerWidth < 768;
                const targetW = isMobile ? window.innerWidth * 0.9 : 400;
                const targetH = isMobile ? window.innerHeight * 0.7 : 600;

                gsap.to(clone, {
                    width: targetW, height: targetH,
                    left: (window.innerWidth - targetW) / 2,
                    top: (window.innerHeight - targetH) / 2,
                    borderRadius: 20, duration: 0.5, ease: "back.out(1.2)"
                });
            }

            closeCard() {
                if (!this.expandedCard) return;
                const card = this.expandedCard;
                const clone = this.cardClone;
                const rect = card.getBoundingClientRect(); // Posición original (invisible)

                // Ocultar contenido interno primero
                clone.querySelector(".expanded-content").style.opacity = 0;
                clone.querySelector(".card-close").style.opacity = 0;

                gsap.to(clone, {
                    width: rect.width, height: rect.height,
                    left: rect.left, top: rect.top,
                    duration: 0.4, ease: "power2.in",
                    onComplete: () => {
                        clone.remove();
                        gsap.set(card, { opacity: 1 });
                        this.track.classList.remove("blurred");
                        this.expandedCard = null;
                    }
                });
            }

            attachEvents() {
                // Click (Solo en Desktop o Tap en movil)
                this.cards.forEach(card => {
                    card.addEventListener("click", () => {
                        if (this.cards.indexOf(card) === 0) this.expandCard(card);
                    });
                });

                // Drag Logic
                this.container.addEventListener("mousedown", e => { this.isDragging = true; this.startX = e.clientX; });
                this.container.addEventListener("touchstart", e => { this.isDragging = true; this.startX = e.touches[0].clientX; }, {passive:false});

                const moveHandler = (clientX) => {
                    if (!this.isDragging || this.expandedCard) return;
                    const diff = clientX - this.startX;
                    if (Math.abs(diff) > 50) { 
                        this.rotate(diff > 0 ? "prev" : "next");
                        this.startX = clientX; this.isDragging = false; 
                    }
                };

                document.addEventListener("mousemove", e => moveHandler(e.clientX));
                document.addEventListener("touchmove", e => moveHandler(e.touches[0].clientX), {passive:false});
                document.addEventListener("mouseup", () => this.isDragging = false);
                document.addEventListener("touchend", () => this.isDragging = false);
            }
        }

        // --- 3. GESTIÓN BOTONES FLOTANTES (FABs) ---
        const initDrawers = () => {
            const restart = document.getElementById('restartDrawer');
            const music = document.getElementById('musicDrawer');
            const closeP = document.getElementById('closePlayer');

            // Lógica Reiniciar
            restart.addEventListener('click', () => {
                if (restart.classList.contains('active')) {
                    NavigationManager.restart('index.html');
                } else {
                    restart.classList.add('active');
                    setTimeout(() => restart.classList.remove('active'), 3000);
                }
            });

            // Lógica Música
            music.addEventListener('click', (e) => {
                if (e.target.closest('.player-content')) return; // No cerrar si clickeas adentro
                music.classList.add('active');
            });

            closeP.addEventListener('click', (e) => {
                e.stopPropagation();
                music.classList.remove('active');
            });
        };

        // --- 4. LOGICA PLAYER ---
        const initPlayer = () => {
            const track = document.getElementById('audio-track');
            const play = document.getElementById('playBtn');
            const pause = document.getElementById('pauseBtn');
            const wave = document.querySelector('.wave-mini svg path');

            play.onclick = () => { track.play(); play.style.display='none'; pause.style.display='block'; wave.style.animationName='morph'; }
            pause.onclick = () => { track.pause(); pause.style.display='none'; play.style.display='block'; wave.style.animationName='none'; }
        };

        // --- 5. NAV & ESTRELLAS ---
        const NavigationManager = (() => {
            const overlay = document.getElementById('transition-overlay');
            const container = document.body;
            
            if (sessionStorage.getItem('returningFromSection')) {
                overlay.style.opacity = 1;
                setTimeout(() => overlay.style.opacity = 0, 100);
                sessionStorage.removeItem('returningFromSection');
            }

            return {
                zoomTo: (url) => {
                    container.style.transform = "scale(5)"; 
                    container.style.opacity = "0";
                    container.style.transition = "1s ease";
                    setTimeout(() => { overlay.style.opacity = 1; }, 300);
                    setTimeout(() => { 
                        sessionStorage.setItem('returningFromSection', 'true');
                        window.location.href = url; 
                    }, 800);
                },  
                restart: (url) => {
                    overlay.style.opacity = 1;
                    setTimeout(() => window.location.href = url, 500);
                }
            }
        })();

        const StarSystem = (() => {
            const sheet = document.createElement("style");
            const gen = (n) => Array.from({length:n}, () => `${Math.floor(Math.random()*2000)}px ${Math.floor(Math.random()*2000)}px #FFF`).join(',');
            sheet.innerText = `#stars{box-shadow:${gen(700)}} #stars2{box-shadow:${gen(200)}}`;
            document.head.appendChild(sheet);
        })();

        // --- INIT GLOBAL ---
        document.addEventListener('DOMContentLoaded', () => {
            StarSystem;
            new CircularSlider();
            initDrawers();
            initPlayer();
        });

    </script>
</body>
</html>
