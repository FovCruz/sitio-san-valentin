<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@600&family=Darker+Grotesque:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        /* --- 1. CONFIGURACIÓN & RESET --- */
        @property --border-angle {
            syntax: "<angle>";
            inherits: true;
            initial-value: 0turn;
        }

        :root {
            --bg-top: #1B2735;
            --bg-bottom: #090A0F;
            --accent-pink: #ff4081;
            /* Colores Románticos y Elegantes para el borde */
            --color-1: #ff75a0;
            --color-2: #8062d6;
            --color-3: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(ellipse at bottom, var(--bg-top) 0%, var(--bg-bottom) 100%);
            height: 100vh;
            overflow: hidden;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* --- 2. FONDO DE ESTRELLAS --- */
        .star-layer { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; background: transparent;}
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }
        #stars { width: 1px; height: 1px; animation: animStar 50s linear infinite; }
        #stars2 { width: 2px; height: 2px; animation: animStar 100s linear infinite; }

        /* --- 3. HEADER --- */
        .header { position: absolute; top: 20px; text-align: center; z-index: 10; width: 100%; pointer-events: none; }
        .main-title { font-family: 'Dancing Script', cursive; font-size: clamp(2.5rem, 5vw, 4rem); text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }

        /* --- 4. CARTAS Y EFECTO TURBO --- */
        .slider-container { perspective: 1500px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: grab; z-index: 5; touch-action: none; }
        .slider-track { transform-style: preserve-3d; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: filter 0.5s ease; }
        .slider-track.blurred { filter: blur(10px) brightness(0.3); }

        .card {
            position: absolute;
            width: 260px;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            border: solid 3px transparent;
            background-clip: padding-box;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        /* Solo la carta central o expandida tiene el borde animado */
        .card.active-border {
            animation: bg-spin 4s linear infinite;
            background: 
                linear-gradient(rgba(30, 30, 30, 0.95), rgba(10, 10, 10, 0.95)) padding-box,
                conic-gradient(from var(--border-angle), transparent 20%, var(--color-1), var(--color-2), var(--color-3), transparent 80%) border-box;
        }

        @keyframes bg-spin { to { --border-angle: 1turn; } }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            transition: height 0.6s ease;
        }

        /* Overlay al Hover (Solo en carrusel) */
        .hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 3;
            backdrop-filter: blur(4px);
        }
        .card:hover .hover-overlay { opacity: 1; }
        .hover-overlay h3 { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: var(--color-1); }

        /* --- 5. INFO ACOPLADA (Dentro de la carta expandida) --- */
        .card-info {
            padding: 1.5rem;
            text-align: center;
            background: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            display: none;
        }

        /* Estado Expandido */
        .card.expanded {
            height: auto !important;
            z-index: 1000;
        }
        .card.expanded img { height: 280px; } /* Ajuste de altura imagen */
        .card.expanded .card-info { display: block; opacity: 1; }
        .card.expanded .hover-overlay { display: none; }

        .enter-btn {
            background: linear-gradient(45deg, var(--color-2), var(--color-1));
            color: white; border: none; padding: 10px 25px; border-radius: 20px;
            cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* --- 6. BOTONES DE NAVEGACIÓN --- */
        .close-btn { 
            position: fixed; top: 30px; right: 30px; width: 50px; height: 50px; 
            background: rgba(255,255,255,0.1); border-radius: 50%; color: white; 
            border: 1px solid var(--glass-border); cursor: pointer; opacity: 0; 
            z-index: 1002; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .close-btn.visible { opacity: 1; }
        .close-btn:hover { background: var(--color-1); transform: rotate(90deg); }

        .restart-btn { position: fixed; bottom: 30px; left: 30px; background: rgba(20,30,50,0.6); color: #fff; width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--glass-border); cursor: pointer; z-index: 2000; }
        
        #transition-overlay { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9999; transition: 0.8s ease; }

        @media (max-width: 768px) {
            .card { width: 220px; height: 320px; }
            .card.expanded { width: 85vw !important; }
        }
    </style>
</head>

<body>
    <div id="stars" class="star-layer"></div>
    <div id="stars2" class="star-layer"></div>
    <div id="transition-overlay"></div>

    <div class="header">
        <h1 class="main-title">Nuestros Recuerdos</h1>
    </div>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack">
            <div class="card" data-title="Nuestra Historia" data-desc="El comienzo de todo... donde nuestra aventura empezó a escribirse." data-link="libro/index.html">
                <img src="assets/copas.jpg" alt="Historia">
                <div class="hover-overlay"><h3>Historia</h3><span>Ver más</span></div>
            </div>

            <div class="card" data-title="Cupones de Amor" data-desc="Canjeables por besos, abrazos y momentos que no tienen precio." data-link="cuponera-estatica.html">
                <img src="assets/cuponera.jpg" alt="Cupones">
                <div class="hover-overlay"><h3>Cupones</h3><span>Canjear</span></div>
            </div>

            <div class="card" data-title="Nuestro Mapa" data-desc="Cada lugar tiene un recuerdo, y cada camino nos lleva a nosotros." data-link="mapa/index.html">
                <img src="assets/mapa.jpg" alt="Mapa">
                <div class="hover-overlay"><h3>Mapa</h3><span>Explorar</span></div>
            </div>

            <div class="card" data-title="Playlist" data-desc="Las canciones que han marcado el ritmo de nuestro corazón." data-link="playlist/index.html">
                <img src="assets/musica.jpg" alt="Musica">
                <div class="hover-overlay"><h3>Música</h3><span>Escuchar</span></div>
            </div>

            <div class="card" data-title="Dosis de Ternura" data-desc="Un pequeño rincón lleno de gatitos y amor para alegrar tu día." data-link="sorpresa.html">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&h=800" alt="Sorpresa">
                <div class="hover-overlay"><h3>Sorpresa</h3><span>Abrir</span></div>
            </div>
        </div>
    </div>

    <button class="close-btn" id="closeBtn"><i class="fas fa-times"></i></button>
    <button class="restart-btn" onclick="location.reload()" title="Reiniciar"><i class="fas fa-redo"></i></button>

    <script>
        // Configuración de posiciones en arco
        const positions = [
            { z: 250, rotateY: 0, x: 0, opacity: 1 },
            { z: 150, rotateY: -30, x: 230, opacity: 0.7 },
            { z: 50, rotateY: -45, x: 380, opacity: 0.4 },
            { z: 50, rotateY: 45, x: -380, opacity: 0.4 },
            { z: 150, rotateY: 30, x: -230, opacity: 0.7 }
        ];

        class TurboSlider {
            constructor() {
                this.track = document.getElementById("sliderTrack");
                this.cards = Array.from(document.querySelectorAll(".card"));
                this.container = document.getElementById("sliderContainer");
                this.closeBtn = document.getElementById("closeBtn");
                this.expandedCard = null;
                this.clone = null;
                this.init();
            }

            init() {
                this.update();
                this.bindEvents();
            }

            update() {
                this.cards.forEach((card, i) => {
                    const pos = positions[i];
                    if (i === 0) card.classList.add('active-border');
                    else card.classList.remove('active-border');

                    gsap.to(card, {
                        x: pos.x, z: pos.z, rotationY: pos.rotateY, opacity: pos.opacity,
                        duration: 0.6, ease: "power2.out"
                    });
                    card.style.pointerEvents = (i === 0 || i === 1 || i === 4) ? "all" : "none";
                });
            }

            expand(card) {
                if (this.expandedCard) return;
                this.expandedCard = card;

                const rect = card.getBoundingClientRect();
                const clone = card.cloneNode(true);
                clone.classList.add("expanded", "active-border");

                // Inyectar la info directamente en el clon para el acople
                const infoHTML = `
                    <div class="card-info" style="display: block; opacity: 1;">
                        <h2 style="font-family: 'Dancing Script'; color: var(--color-1); font-size: 2rem; margin-bottom: 5px;">${card.dataset.title}</h2>
                        <p style="margin-bottom: 20px; color: #ccc; font-size: 0.95rem; line-height: 1.4;">${card.dataset.desc}</p>
                        <button class="enter-btn" onclick="document.getElementById('transition-overlay').style.opacity=1; setTimeout(()=>location.href='${card.dataset.link}', 800);">Abrir contenido</button>
                    </div>
                `;
                clone.insertAdjacentHTML('beforeend', infoHTML);

                Object.assign(clone.style, {
                    position: "fixed", left: rect.left + "px", top: rect.top + "px",
                    width: rect.width + "px", height: rect.height + "px", transform: "none", zIndex: "1000"
                });

                document.body.appendChild(clone);
                this.clone = clone;
                this.track.classList.add("blurred");
                card.style.opacity = "0";

                gsap.to(clone, {
                    width: 350, height: "auto",
                    left: (window.innerWidth - 350) / 2,
                    top: (window.innerHeight - 500) / 2,
                    duration: 0.7, ease: "power3.out",
                    onComplete: () => this.closeBtn.classList.add("visible")
                });
            }

            close() {
                if (!this.expandedCard) return;
                this.closeBtn.classList.remove("visible");
                const rect = this.expandedCard.getBoundingClientRect();

                gsap.to(this.clone, {
                    width: rect.width, height: rect.height, left: rect.left, top: rect.top,
                    duration: 0.5, ease: "power2.inOut",
                    onComplete: () => {
                        this.clone.remove();
                        this.expandedCard.style.opacity = "1";
                        this.track.classList.remove("blurred");
                        this.expandedCard = null;
                    }
                });
            }

            rotate(dir) {
                if (dir === "next") this.cards.push(this.cards.shift());
                else this.cards.unshift(this.cards.pop());
                this.update();
            }

            bindEvents() {
                this.cards.forEach(card => {
                    card.onclick = () => {
                        const idx = this.cards.indexOf(card);
                        if (idx === 0) this.expand(card);
                        else if (idx === 1) this.rotate("next");
                        else if (idx === 4) this.rotate("prev");
                    };
                });

                this.closeBtn.onclick = () => this.close();

                // Swipe/Drag
                let startX = 0;
                this.container.addEventListener('touchstart', e => startX = e.touches[0].clientX);
                this.container.addEventListener('touchend', e => {
                    if (this.expandedCard) return;
                    let diff = e.changedTouches[0].clientX - startX;
                    if (Math.abs(diff) > 50) this.rotate(diff > 0 ? "prev" : "next");
                });
                
                this.container.onmousedown = e => startX = e.clientX;
                this.container.onmouseup = e => {
                    if (this.expandedCard) return;
                    let diff = e.clientX - startX;
                    if (Math.abs(diff) > 50) this.rotate(diff > 0 ? "prev" : "next");
                };
            }
        }

        // Estrellas Dinámicas
        const StarSystem = (() => {
            const generateShadows = (n) => {
                let value = '';
                for (let i = 0; i < n; i++) value += `${Math.floor(Math.random() * 2000)}px ${Math.floor(Math.random() * 2000)}px #FFF, `;
                return value.slice(0, -2);
            };
            const s1 = generateShadows(700); const s2 = generateShadows(200);
            const style = document.createElement("style");
            style.innerText = `#stars{box-shadow:${s1}}#stars::after{box-shadow:${s1}}#stars2{box-shadow:${s2}}#stars2::after{box-shadow:${s2}}`;
            document.head.appendChild(style);
        })();

        document.addEventListener("DOMContentLoaded", () => new TurboSlider());
    </script>
</body>
</html>
