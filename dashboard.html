<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo ❤️</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@600&family=Darker+Grotesque:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        /* --- 1. CONFIGURACIÓN & RESET --- */
        :root {
            --bg-top: #1B2735;
            --bg-bottom: #090A0F;
            --text-color: #ffffff;
            --accent-color: #6868d5;
            --accent-pink: #ff4081;
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(ellipse at bottom, var(--bg-top) 0%, var(--bg-bottom) 100%);
            height: 100vh;
            overflow: hidden;
            /* Vital para el slider */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* --- 2. FONDO DE ESTRELLAS --- */
        .star-layer {
            position: fixed;
            top: 0;
            left: 0;
            background: transparent;
            z-index: -1;
            pointer-events: none;
        }

        .star-layer::after {
            content: " ";
            position: absolute;
            top: 2000px;
            background: transparent;
        }

        @keyframes animStar {
            from {
                transform: translateY(0px);
            }

            to {
                transform: translateY(-2000px);
            }
        }

        #stars {
            width: 1px;
            height: 1px;
            animation: animStar 50s linear infinite;
        }

        #stars::after {
            width: 1px;
            height: 1px;
        }

        #stars2 {
            width: 2px;
            height: 2px;
            animation: animStar 100s linear infinite;
        }

        #stars2::after {
            width: 2px;
            height: 2px;
        }

        /* --- 3. UI DASHBOARD (HEADER) --- */
        .header {
            position: absolute;
            top: 40px;
            text-align: center;
            z-index: 10;
            width: 100%;
            pointer-events: none;
        }

        .subtitle {
            color: var(--accent-pink);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: white;
            line-height: 1.1;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* --- 4. SLIDER 3D (Circular Slider) --- */
        .slider-container {
            perspective: 1500px;
            perspective-origin: 50% 50%;
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: grab;
            z-index: 5;
            touch-action: none;
            /* Importante para arrastrar en móvil */
        }

        .slider-container.dragging {
            cursor: grabbing;
        }

        .slider-track {
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
        }

        .card {
            position: absolute;
            /* Cambiado a absolute para stackear */
            width: 260px;
            height: 380px;
            /* Tamaño base */
            background: #1e1e1e;
            overflow: hidden;
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Efectos de la carta */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* Overlay al hacer hover (Solo Desktop) */
        .hover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(104, 104, 213, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 3;
            backdrop-filter: blur(2px);
        }

        .card:hover .hover-overlay {
            opacity: 1;
        }

        .hover-overlay span {
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
        }

        /* Estado Expandido */
        .card.expanded {
            z-index: 1000 !important;
        }

        .slider-track.blurred .card:not(.expanded) {
            filter: blur(5px) brightness(0.5);
            transition: filter 0.6s ease;
        }

        /* --- 5. INFO OVERLAY (Detalles) --- */
        .card-info {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s ease;
            z-index: 1001;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .card-info.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }

        .card-info h2 {
            font-size: 2rem;
            color: var(--accent-pink);
            margin-bottom: 10px;
            font-family: 'Dancing Script', cursive;
        }

        .card-info p {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .enter-btn {
            background: linear-gradient(45deg, var(--accent-color), var(--accent-pink));
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s;
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        /* Botón Cerrar (X) */
        .close-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1002;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            color: white;
        }

        .close-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .close-btn:hover {
            background: var(--accent-pink);
            transform: rotate(90deg);
        }

        /* --- 6. UTILITIES (Zoom Overlay) --- */
        #transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        .zooming-in {
            transform: scale(20);
            pointer-events: none;
        }

        .zooming-out-start {
            transform: scale(20);
            opacity: 0;
        }

        .zooming-out-end {
            transform: scale(1);
            opacity: 1;
        }

        /* --- 7. REPRODUCTOR & RESTART (Existing) --- */
        .restart-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 2000;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        #player-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            align-items: flex-end;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #player-wrapper.hidden {
            transform: translateX(calc(100% + 20px));
        }

        .player-toggle-btn {
            position: absolute;
            left: -50px;
            bottom: 10px;
            width: 40px;
            height: 40px;
            background: var(--accent-color);
            border-radius: 50%;
            border: none;
            color: white;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        #player-wrapper.hidden .player-toggle-btn {
            display: flex;
        }

        #v-player {
            font-family: 'Darker Grotesque', sans-serif;
            width: 320px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .episode-title {
            font-size: 1.2rem;
            margin: 5px 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            font-weight: 700;
        }

        .wave svg path {
            fill: url(#PSgrad_0);
            animation: 4s infinite;
        }

        @keyframes morph {

            0%,
            100% {
                d: path('M450,40 L0,40 L0,17.3134328 C18.6666667,24.8756219 32,28.6567164 40,28.6567164 C52,28.6567164 71,5.97014925 86,5.97014925 C101,5.97014925 107,19.7014925 122,19.7014925 C137,19.7014925 143,0 156,0 C169,0 177,36.4179104 194,36.4179104 C211,36.4179104 208,20.2985075 220,20.2985075 C232,20.2985075 240,28.6567164 256,28.6567164 C272,28.6567164 276,5.97014925 289,5.97014925 C302,5.97014925 314,23.2835821 326,23.2835821 C338,23.2835821 354,10.7462687 365,10.7462687 C376,10.7462687 397,32.8358209 408,32.8358209 C415.333333,32.8358209 429.333333,27.6616915 450,17.3134328 L450,40 Z');
            }

            50% {
                d: path('M450,40 L0,40 L0,13.3333333 C14.6666667,9.12280702 26,7.01754386 34,7.01754386 C46,7.01754386 53,26.6666667 68,26.6666667 C83,26.6666667 90,16.1403509 105,16.1403509 120,16.1403509 141,0 154,0 C167,0 173,20.3508772 190,20.3508772 C207,20.3508772 225,0 237,0 C249,0 245,16.1403509 261,16.1403509 C277,16.1403509 278,9.8245614 291,9.8245614 C304,9.8245614 314,28.7719298 326,28.7719298 C338,28.7719298 354,13.3333333 365,13.3333333 C376,13.3333333 397,7.01754386 408,7.01754386 C415.333333,7.01754386 429.333333,9.12280702 450,13.3333333 L450,40 Z');
            }
        }

        #controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        #play,
        #pause {
            font-size: 24px;
            color: var(--accent-color);
            cursor: pointer;
            padding: 0 10px;
        }

        #pause {
            display: none;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            margin: 0 10px;
        }

        .fill-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 10px;
            pointer-events: none;
        }

        #seek {
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 10px;
            opacity: 0;
            cursor: pointer;
        }

        .time {
            font-size: 12px;
            color: #aaa;
            min-width: 35px;
        }

        #close-player-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            #player-wrapper {
                right: 0;
                bottom: 80px;
                transform: translateX(100%);
            }

            #player-wrapper.visible {
                transform: translateX(0);
            }

            .player-toggle-btn {
                display: flex;
                right: 100%;
                left: auto;
                border-radius: 50% 0 0 50%;
            }

            .main-title {
                font-size: 2.5rem;
                margin-top: 20px;
            }

            .card {
                width: 220px;
                height: 320px;
            }
        }

        @media (max-width: 768px) {
            .card {
                width: 200px;
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <div id="stars" class="star-layer"></div>

    <div class="header">

                <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 299 35">
                    <linearGradient id="PSgrad_0" x1="70.711%" x2="0%" y1="70.711%" y2="0%">
                        <stop offset="0%" stop-color="rgb(104,104,213)" stop-opacity="1" />

    <script>
        // --- 1. CONFIGURACIÓN DE POSICIONES 3D (ARCO) ---
        // Definimos 5 posiciones fijas para las 5 cartas
        const positions = [
            // Centro
            { z: 220, rotateY: 0, x: 0, opacity: 1 },

            // Derecha 1
            { z: 130, rotateY: -20, x: 200, opacity: 0.85 },

            // Derecha 2 (Atrás)
            { z: 40, rotateY: -35, x: 320, opacity: 0.6 },

            // Izquierda 2 (Atrás)
            { z: 40, rotateY: 35, x: -320, opacity: 0.6 },

            // Izquierda 1
            { z: 130, rotateY: 20, x: -200, opacity: 0.85 }
        ];
        if (window.innerWidth <= 768) {
            positions[0] = { z: 180, rotateY: 0, x: 0, opacity: 1 };
            positions[1] = { z: 100, rotateY: -18, x: 140, opacity: 0.85 };
            positions[2] = { z: 30, rotateY: -30, x: 220, opacity: 0.6 };
            positions[3] = { z: 30, rotateY: 30, x: -220, opacity: 0.6 };
            positions[4] = { z: 100, rotateY: 18, x: -140, opacity: 0.85 };
        }



        // --- 2. CLASE DEL SLIDER ---
        class CircularSlider {
            constructor() {
                this.container = document.getElementById("sliderContainer");
                this.track = document.getElementById("sliderTrack");
                this.cards = Array.from(document.querySelectorAll(".card"));
                this.totalCards = this.cards.length;
                this.isDragging = false;
                this.startX = 0;
                this.dragDistance = 0;
                this.threshold = 50; // Sensibilidad del arrastre
                this.expandedCard = null;

                // Elementos UI
                this.cardInfo = document.getElementById("cardInfo");
                this.cardTitle = document.getElementById("cardTitle");
                this.cardDesc = document.getElementById("cardDesc");
                this.enterBtn = document.getElementById("enterBtn");
                this.closeBtn = document.getElementById("closeBtn");

                this.init();
            }

            init() {
                this.updatePositions();
                this.attachEvents();
            }

            updatePositions() {
                this.cards.forEach((card, index) => {
                    // Mapeamos el índice actual a una posición visual
                    // Si el array de cartas cambia de orden, las posiciones se mantienen visualmente fijas
                    const pos = positions[index];

                    gsap.to(card, {
                        x: pos.x,
                        z: pos.z,
                        rotationY: pos.rotateY,
                        opacity: pos.opacity,
                        duration: 0.5,
                        ease: "power2.out"
                    });

                    // Solo la carta central es clickeable para expandir
                    card.style.pointerEvents = (index === 0) ? "all" : "none";
                });
            }

            rotate(direction) {
                if (this.expandedCard) return;

                if (direction === "next") {
                    // Mover la primera al final
                    const first = this.cards.shift();
                    this.cards.push(first);
                } else {
                    // Mover la última al principio
                    const last = this.cards.pop();
                    this.cards.unshift(last);
                }
                this.updatePositions();
            }

            expandCard(card) {
                if (this.expandedCard) return;
                this.expandedCard = card;

                // 1. Datos
                this.cardTitle.textContent = card.dataset.title;
                this.cardDesc.textContent = card.dataset.desc;
                // Configurar el botón de entrar
                this.enterBtn.onclick = () => NavigationManager.zoomTo(card.dataset.link);

                // 2. Clonar para animación
                const rect = card.getBoundingClientRect();
                const clone = card.cloneNode(true);
                // Limpiar clon
                clone.style.position = "fixed";
                clone.style.left = rect.left + "px";
                clone.style.top = rect.top + "px";
                clone.style.width = rect.width + "px";
                clone.style.height = rect.height + "px";
                clone.style.transform = "none";
                clone.style.zIndex = "1000";
                clone.style.margin = "0";
                clone.classList.add("expanded");
                // Quitar overlay del clon
                const ov = clone.querySelector(".hover-overlay"); if (ov) ov.style.display = "none";

                document.body.appendChild(clone);
                this.cardClone = clone;

                // Ocultar original
                gsap.set(card, { opacity: 0 });
                this.track.classList.add("blurred");

                // 3. Animar expansión
                // Calculamos centro de pantalla
                const wW = window.innerWidth;
                const wH = window.innerHeight;
                const targetW = Math.min(500, wW * 0.9);
                const targetH = Math.min(650, wH * 0.7);

                gsap.to(clone, {
                    width: targetW,
                    height: targetH,
                    left: (wW - targetW) / 2,
                    top: (wH - targetH) / 2 - 50, // Un poco arriba para dejar sitio al texto
                    duration: 0.6,
                    ease: "power3.out",
                    onComplete: () => {
                        this.cardInfo.classList.add("visible");
                        this.closeBtn.classList.add("visible");
                    }
                });
            }

            closeCard() {
                if (!this.expandedCard) return;

                this.cardInfo.classList.remove("visible");
                this.closeBtn.classList.remove("visible");

                const card = this.expandedCard;
                const clone = this.cardClone;

                // Como las cartas se movieron o estamos en 3D, recalculamos donde DEBERÍA estar
                // Pero como el original está opacity 0 en su sitio, usamos getBoundingClientRect del original invisible
                // Nota: Si rotamos mientras está expandido, esto podría fallar, pero bloqueamos rotación.

                // Forzamos update para asegurar posición (aunque no debería haber cambiado)
                const rect = card.getBoundingClientRect(); // Esto funciona aunque opacity sea 0

                gsap.to(clone, {
                    width: rect.width,
                    height: rect.height,
                    left: rect.left,
                    top: rect.top,
                    duration: 0.5,
                    ease: "power2.in",
                    onComplete: () => {
                        clone.remove();
                        gsap.set(card, { opacity: 1 });
                        this.track.classList.remove("blurred");
                        this.expandedCard = null;
                        this.cardClone = null;
                    }
                });
            }

            handleDragStart(e) {
                if (this.expandedCard) return;
                this.isDragging = true;
                this.container.classList.add("dragging");
                this.startX = e.type.includes("mouse") ? e.clientX : e.touches[0].clientX;
            }

            handleDragMove(e) {
                if (!this.isDragging) return;
                e.preventDefault();
                const currentX = e.type.includes("mouse") ? e.clientX : e.touches[0].clientX;
                const diff = currentX - this.startX;

                if (Math.abs(diff) > this.threshold) {
                    const dir = diff > 0 ? "prev" : "next";
                    this.rotate(dir);
                    this.startX = currentX; // Reset para scroll continuo
                }
            }

            handleDragEnd() {
                this.isDragging = false;
                this.container.classList.remove("dragging");
            }

            attachEvents() {
                // Click en cartas
                this.cards.forEach(card => {
                    card.addEventListener("click", () => {
                        // Solo expandir si está en el centro (index 0 en nuestro array lógica)
                        if (this.cards.indexOf(card) === 0 && !this.expandedCard) {
                            this.expandCard(card);
                        } else if (!this.expandedCard) {
                            // Si tocas una de los lados, girar hacia ella
                            const idx = this.cards.indexOf(card);
                            // Lógica simple: si index es 1 (derecha), next. Si es 4 (izquierda), prev.
                            if (idx === 1) this.rotate("next");
                            if (idx === 4) this.rotate("prev");
                        }
                    });
                });

                this.closeBtn.addEventListener("click", () => this.closeCard());

                // Drag Events
                this.container.addEventListener("mousedown", e => this.handleDragStart(e));
                this.container.addEventListener("touchstart", e => this.handleDragStart(e), { passive: false });

                document.addEventListener("mousemove", e => this.handleDragMove(e));
                document.addEventListener("touchmove", e => this.handleDragMove(e), { passive: false });

                document.addEventListener("mouseup", () => this.handleDragEnd());
                document.addEventListener("touchend", () => this.handleDragEnd());
            }
        }

        // --- 3. SISTEMAS EXISTENTES (Estrellas, Audio, Nav) ---
        const StarSystem = (() => {
            const generateShadows = (n) => {
                let value = '';
                for (let i = 0; i < n; i++) value += `${Math.floor(Math.random() * 2000)}px ${Math.floor(Math.random() * 2000)}px #FFF, `;
                return value.slice(0, -2);
            };
            const initStatic = () => {
                const s1 = generateShadows(700); const s2 = generateShadows(200);
                const sheet = document.createElement("style");
                sheet.innerText = `#stars{box-shadow:${s1}}#stars::after{box-shadow:${s1}}#stars2{box-shadow:${s2}}#stars2::after{box-shadow:${s2}}`;
                document.head.appendChild(sheet);
            };
            return { init: initStatic };
        })();

        const NavigationManager = (() => {
            const container = document.body; // Animamos todo el body
            const overlay = document.getElementById('transition-overlay');

            const init = () => {
                const comingBack = sessionStorage.getItem('returningFromSection');
                if (comingBack === 'true') {
                    overlay.style.opacity = 1;
                    setTimeout(() => { overlay.style.opacity = 0; }, 100);
                    sessionStorage.removeItem('returningFromSection');
                }
            };

            const zoomTo = (url) => {
                // Zoom Out efecto al overlay negro
                overlay.style.opacity = 1;
                setTimeout(() => { window.location.href = url; }, 1000);
            };

            const restart = (url) => {
                overlay.style.opacity = 1;
                setTimeout(() => { window.location.href = url; }, 800);
            };

            return { init, zoomTo, restart };
        })();

        const AudioPlayer = (() => {
            const track = document.getElementById('audio-track');
            const playBtn = document.getElementById('play');
            const pauseBtn = document.getElementById('pause');
            const fillBar = document.querySelector('.fill-bar');
            const seekSlider = document.getElementById('seek');
            const currentTimeEl = document.querySelector('.time.current');
            const durationEl = document.querySelector('.time.till-end');
            const wave = document.querySelector('.wave svg path');
            const wrapper = document.getElementById('player-wrapper');
            const toggleBtn = document.getElementById('toggle-player');
            const closeBtn = document.getElementById('close-player-btn');

            playBtn.addEventListener('click', () => { track.play(); playBtn.style.display = 'none'; pauseBtn.style.display = 'block'; wave.style.animationName = 'morph'; });
            pauseBtn.addEventListener('click', () => { track.pause(); pauseBtn.style.display = 'none'; playBtn.style.display = 'block'; wave.style.animationName = 'none'; });
            track.addEventListener('timeupdate', () => {
                const percent = (track.currentTime / track.duration) * 100;
                fillBar.style.width = percent + '%'; seekSlider.value = track.currentTime;
                currentTimeEl.innerText = formatTime(track.currentTime); durationEl.innerText = formatTime(track.duration);
            });
            track.addEventListener('loadedmetadata', () => { seekSlider.max = track.duration; durationEl.innerText = formatTime(track.duration); });
            seekSlider.addEventListener('input', () => { track.currentTime = seekSlider.value; });
            function formatTime(s) { if (isNaN(s)) return "0:00"; const m = Math.floor(s / 60); const sc = Math.floor(s % 60); return `${m}:${sc < 10 ? '0' : ''}${sc}`; }
            toggleBtn.addEventListener('click', () => { wrapper.classList.toggle('visible'); wrapper.classList.toggle('hidden'); });
            closeBtn.addEventListener('click', () => { wrapper.classList.remove('visible'); wrapper.classList.add('hidden'); });

            let ts = 0; wrapper.addEventListener('touchstart', e => ts = e.changedTouches[0].screenX);
            wrapper.addEventListener('touchend', e => { if (e.changedTouches[0].screenX > ts + 50) { wrapper.classList.remove('visible'); wrapper.classList.add('hidden'); } });
        })();

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            StarSystem.init();
            NavigationManager.init();
            new CircularSlider();
        });
    </script>
</body>
